# Sponge OS 15-3 DIAGNOSTIC grub.cfg (v5 — full Debian GRUB 2.12)
#
# The vendored g2fg grub2_64.efi's multiboot2 handoff freezes on the
# 17ZD90N even with a trivial payload (v4 proof). v5 replaces the EFI
# image with a full-featured Debian grub-mkimage build (multiboot2,
# echo, gfxterm, efi_gop, ... embedded). If this boots the chain, the
# g2fg build is the culprit and the product media switches GRUB.

set timeout=20
set default=0
set gfxpayload=auto

echo "SPONGE-DIAG v5: debian grub 2.12 alive"
insmod part_gpt
insmod ext2
set root=(hd0,gpt3)

menuentry 'SPONGE-DIAG v5-1: FULL CHAIN to desktop' {
    echo "v5: loading bender..."
    multiboot2 /boot/bender phys_max=256M
    echo "v5: loading sel4..."
    module2 /boot/sel4 sel4 disable_iommu console_port=0x3f8 debug_port=0x3f8
    echo "v5: loading image.elf..."
    module2 /boot/image.elf image.elf
    echo "v5: booting now"
    boot
}

menuentry 'SPONGE-DIAG v5-2: MB2-PROBE minimal kernel' {
    multiboot2 /boot/mb2probe.elf
    boot
}

menuentry 'SPONGE-DIAG v5-3: bender only' {
    multiboot2 /boot/bender phys_max=256M
    boot
}
