# Sponge OS 15-3 DIAGNOSTIC grub.cfg (v11 — timing-ladder FB-tag bisect)
#
# v10 results on the 17ZD90N (user-reported): fbprobe3 hung BLACK on all
# three entries (plain / +cutmem 1G / +1024x768x32) — never green, never
# the no-tag reset. So GRUB almost certainly DOES emit a framebuffer tag
# (the no-tag case resets), and the remaining candidates are: the FB
# address is >= 4 GiB (the "high GOP framebuffer" hypothesis — also
# explains the kernel fb-console death, since its identity-phase writes
# only reach the low 4 GiB), or the MBI itself sits above 4 GiB.
#
# v11's fbprobe4 separates the cases by WHEN it reboots (time from
# Enter to the screen dropping back to the firmware/GRUB):
#   ~3 s  : handoff anomaly (EAX magic wrong)
#   ~6 s  : MBI unreadable (placed above 4 GiB — placement problem)
#   ~12 s : no FB tag in a readable MBI (tag-emission problem)
#   ~24 s : FB tag present, framebuffer address >= 4 GiB (high-FB)
#   permanent black : bpp != 32
#   GREEN           : tag present and usable (chain problem downstream)
# Timing is approximate (busy loop, 2x-spaced buckets); the ranking is
# what matters. Each case reboots back to this menu.
#
# Entries 4/5 boot the full Sponge OS chain with the updated kernel:
# the fb console is now high-FB-safe (defers drawing until the direct
# map covers the FB, up to 512 GiB) and device-untyped coverage is
# extended above the memory-map top (so boot_fb can map a high FB).
# If the high-FB hypothesis is right, entry 4 should show the kernel
# boot log on the panel, and possibly reach the desktop.
#
# Menu stays on the UEFI TEXT console (proven visible).

set timeout=-1
set default=0

insmod part_gpt
insmod ext2
insmod all_video
insmod gfxterm
insmod videoinfo
insmod multiboot2

echo "SPONGE-DIAG v11 - timing-ladder FB bisect"
echo "  1 fbprobe4: reboot after ~3s=magic / ~6s=MBI-high / ~12s=no-tag"
echo "             / ~24s=FB-above-4GiB ; black-forever=bpp ; green=tag OK"
echo "  2 fbprobe4 + cutmem 1G"
echo "  3 fbprobe4 + gfxpayload=1024x768x32"
echo "  4 Sponge OS chain (high-FB-safe kernel fb console)"
echo "  5 Sponge OS chain + gfxpayload=keep"
echo "  6 videoinfo"

menuentry 'v11-1: fbprobe4 (default payload modes)' {
    set gfxpayload=2560x1600x32,1024x768x32,auto
    terminal_output gfxterm
    set root=(hd0,gpt1)
    multiboot2 /fbprobe4.elf
    boot
}

menuentry 'v11-2: fbprobe4 + cutmem 1G' {
    cutmem 1G 8G
    set gfxpayload=2560x1600x32,1024x768x32,auto
    terminal_output gfxterm
    set root=(hd0,gpt1)
    multiboot2 /fbprobe4.elf
    boot
}

menuentry 'v11-3: fbprobe4 + gfxpayload=1024x768x32' {
    set gfxpayload=1024x768x32
    terminal_output gfxterm
    set root=(hd0,gpt1)
    multiboot2 /fbprobe4.elf
    boot
}

menuentry 'v11-4: Sponge OS chain (high-FB-safe fb console)' {
    set gfxpayload=2560x1600x32,1024x768x32,auto
    terminal_output gfxterm
    set root=(hd0,gpt3)
    multiboot2 /boot/bender serial intel_hwp_performance phys_max=256M serial_fallback
    module2 /boot/sel4 sel4 disable_iommu console_port=0x3f8 debug_port=0x3f8
    module2 /boot/image.elf image.elf
    boot
}

menuentry 'v11-5: Sponge OS chain + gfxpayload=keep' {
    set gfxpayload=keep
    terminal_output gfxterm
    set root=(hd0,gpt3)
    multiboot2 /boot/bender serial intel_hwp_performance phys_max=256M serial_fallback
    module2 /boot/sel4 sel4 disable_iommu console_port=0x3f8 debug_port=0x3f8
    module2 /boot/image.elf image.elf
    boot
}

menuentry 'v11-6: videoinfo (GOP mode list)' {
    videoinfo
}
