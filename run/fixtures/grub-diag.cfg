# Sponge OS 15-3 DIAGNOSTIC grub.cfg (v8 — force-low-memory test)
#
# v7 memory-map forensics (Insyde, 8 GiB): check_mem is clean (no
# reserved overlap with the seL4 phdr range), but the firmware loads
# GRUB/loader data at 0x100360000 (ABOVE 4 GiB). bender is 32-bit
# code whose initial page tables cover <4 GiB only; if GRUB's
# multiboot2 loader places the MBI / module blobs above 4 GiB on
# this machine, bender dies silently reading them — matching the
# observed freeze after "booting now".
#
# v8: `cutmem 1G` forces every GRUB allocation below 1 GiB.
#   - chain boots (further than before / desktop) → high-memory
#     placement was the killer → keep cutmem (or patch allocation)
#   - same freeze                          → bender reads the MBI
#     fine; the hang is in seL4/Genode core (W1 class) — but note
#     the map is NOT very fragmented (one 3.8 GiB conv region), so
#     the W1 untyped-exhaustion variant looks weak on this machine.
#
# Menu waits forever (timeout=-1). Entry 2 = control (no cutmem).

set timeout=-1
set default=0
set gfxpayload=auto
terminal_input console
terminal_output console

echo "SPONGE-DIAG v8: entry1=cutmem 1G, entry2=no cutmem (control)"
insmod part_gpt
insmod ext2
insmod gfxterm

menuentry 'SPONGE-DIAG v8-1: FULL CHAIN with cutmem 1G' {
    cutmem 1G 8G
    set root=(hd0,gpt3)
    multiboot2 /boot/bender serial intel_hwp_performance phys_max=256M serial_fallback
    module2 /boot/sel4 sel4 disable_iommu console_port=0x3f8 debug_port=0x3f8
    module2 /boot/image.elf image.elf
    boot
}

menuentry 'SPONGE-DIAG v8-2: FULL CHAIN control (no cutmem)' {
    set root=(hd0,gpt3)
    multiboot2 /boot/bender serial intel_hwp_performance phys_max=256M serial_fallback
    module2 /boot/sel4 sel4 disable_iommu console_port=0x3f8 debug_port=0x3f8
    module2 /boot/image.elf image.elf
    boot
}
