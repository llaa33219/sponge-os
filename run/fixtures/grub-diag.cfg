# Sponge OS 15-3 DIAGNOSTIC grub.cfg (v9 — GOP/FB-tag/bender bisect)
#
# Context: the production image (gfxterm + gfxpayload, timeout=0) boots
# to a BLACK screen on the 17ZD90N and the kernel early-FB console
# (docs/11 ledger row 12) never shows its `sel4 fb console: ready`
# banner. Candidate layers:
#   (a) GRUB cannot set/drive a GOP graphics mode on the Insyde GOP
#   (b) GRUB sets the mode but does not emit a usable multiboot2 FB tag
#   (c) the tag exists but bender (32-bit, <4 GiB initial page tables)
#       dies reading an MBI GRUB placed above 4 GiB (v7 forensics:
#       Insyde loads GRUB/loader data at 0x100360000)
#   (d) the kernel runs but the GOP LFB is not the scanned-out buffer
#
# This menu bisects them with zero new code, all visible on the panel:
#   entries 1/2: videotest draws via GOP directly          → tests (a)
#   entry 3:     videoinfo dumps the GOP mode list         → context
#   entry 4:     gfxterm + chain (production equivalent)   → (b) vs (c)/(d)
#   entry 5:     gfxterm + chain + cutmem 1G (MBI < 1 GiB) → tests (c)
#   entry 6:     text-console chain (control, no FB tag)   → baseline
#
# The menu itself stays on the UEFI TEXT console (proven visible on
# this machine), so the menu is usable even if GOP graphics are dead.
# Photograph whatever each entry produces.

set timeout=-1
set default=3

insmod part_gpt
insmod ext2
insmod all_video
insmod gfxterm
insmod videotest
insmod videoinfo
insmod multiboot2

echo "SPONGE-DIAG v9 - GOP / FB-tag / bender bisect"
echo "  1/2 videotest pattern (ESC returns to this menu)"
echo "  3   videoinfo GOP mode dump (photograph it)"
echo "  4   Sponge OS chain: gfxterm + fb-console kernel"
echo "  5   Sponge OS chain: gfxterm + cutmem 1G (bender <4GiB fix)"
echo "  6   Sponge OS chain: text console (control, no FB tag)"

menuentry 'v9-1: videotest 2560x1600x32 (native panel mode)' {
    videotest 2560x1600x32
}

menuentry 'v9-2: videotest 1024x768x32 (fallback mode)' {
    videotest 1024x768x32
}

menuentry 'v9-3: videoinfo (GOP mode list)' {
    videoinfo
}

menuentry 'v9-4: Sponge OS chain - gfxterm + fb-console kernel' {
    set gfxpayload=2560x1600x32,1024x768x32,auto
    terminal_output gfxterm
    set root=(hd0,gpt3)
    multiboot2 /boot/bender serial intel_hwp_performance phys_max=256M serial_fallback
    module2 /boot/sel4 sel4 disable_iommu console_port=0x3f8 debug_port=0x3f8
    module2 /boot/image.elf image.elf
    boot
}

menuentry 'v9-5: Sponge OS chain - gfxterm + cutmem 1G' {
    cutmem 1G 8G
    set gfxpayload=2560x1600x32,1024x768x32,auto
    terminal_output gfxterm
    set root=(hd0,gpt3)
    multiboot2 /boot/bender serial intel_hwp_performance phys_max=256M serial_fallback
    module2 /boot/sel4 sel4 disable_iommu console_port=0x3f8 debug_port=0x3f8
    module2 /boot/image.elf image.elf
    boot
}

menuentry 'v9-6: Sponge OS chain - text console (control)' {
    set root=(hd0,gpt3)
    multiboot2 /boot/bender serial intel_hwp_performance phys_max=256M serial_fallback
    module2 /boot/sel4 sel4 disable_iommu console_port=0x3f8 debug_port=0x3f8
    module2 /boot/image.elf image.elf
    boot
}
