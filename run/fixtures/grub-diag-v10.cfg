# Sponge OS 15-3 DIAGNOSTIC grub.cfg (v10 — FB-tag / MBI-placement bisect)
#
# v9 results on the 17ZD90N (user-reported):
#   v9-1/2 videotest 2560x1600x32 + 1024x768x32 : WORK — GRUB drives the
#       Insyde GOP and the LFB is genuinely scanned out (hypotheses (a)
#       "GRUB can't drive the GOP" and (d) "LFB not scanned out" DEAD).
#   v9-3 videoinfo : displays the mode list.
#   v9-4 gfxterm + chain            : BLACK (no fb-console banner).
#   v9-5 gfxterm + chain + cutmem   : BLACK (same).
#   v9-6 text console chain         : "WARNING: no console will be
#       available to OS" (expected — no FB tag in console mode).
#
# What remains: (b) GRUB emits no usable multiboot2 FB tag on Insyde, or
# (c) the MBI/modules are placed above 4 GiB (Insyde loads GRUB data at
# 0x100360000 per v7) so the 32-bit receivers (bender, and the old
# fbprobe2) die before reading anything — note cutmem did NOT cure the
# chain (v9-5), which either weakens (c) for the chain or means cutmem
# does not constrain the multiboot2 MBI placement.
#
# v10 isolates GRUB from the chain with fbprobe3 — a 32-bit multiboot2
# payload loaded DIRECTLY by GRUB (no bender/seL4):
#   GREEN screen : FB tag present, addr < 4 GiB, bpp=32 — tag usable.
#   RESET (reboot loop): MBI readable but carries NO FB tag.
#   BLACK hang   : MBI unreadable/implausible (EBX truncated → MBI
#                  above 4 GiB), FB addr >= 4 GiB, or bpp != 32.
#
# Read the matrix:
#   1 green                     → tag fine on Insyde; the chain's problem
#                                 is downstream (bender/kernel) after all
#   1 reset                     → (b) confirmed: no FB tag even with
#                                 gfxterm + native-mode payload
#   1 black, 2 green            → MBI was above 4 GiB (placement) and the
#                                 tag exists; cutmem fixes placement for
#                                 the probe — then the chain's v9-5
#                                 failure means bender dies on something
#                                 cutmem does not constrain (modules?)
#   1 reset, 2 reset, 3 green   → tag emission fails only for the
#                                 2560x1600-first mode list; use
#                                 1024x768x32 in production
#   4/5                         → chain controls (5 = gfxpayload=keep)
#
# Menu stays on the UEFI TEXT console (proven visible). A reset from
# fbprobe3 just boots back into this menu — pick the next entry.

set timeout=-1
set default=0

insmod part_gpt
insmod ext2
insmod all_video
insmod gfxterm
insmod videoinfo
insmod multiboot2

echo "SPONGE-DIAG v10 - FB tag / MBI placement bisect"
echo "  1 fbprobe3: green=tag OK / reboot=no tag / black=MBI-or-addr problem"
echo "  2 fbprobe3 + cutmem 1G"
echo "  3 fbprobe3 + gfxpayload=1024x768x32"
echo "  4 Sponge OS chain (control)"
echo "  5 Sponge OS chain + gfxpayload=keep"
echo "  6 videoinfo"

menuentry 'v10-1: fbprobe3 (default payload modes)' {
    set gfxpayload=2560x1600x32,1024x768x32,auto
    terminal_output gfxterm
    set root=(hd0,gpt1)
    multiboot2 /fbprobe3.elf
    boot
}

menuentry 'v10-2: fbprobe3 + cutmem 1G' {
    cutmem 1G 8G
    set gfxpayload=2560x1600x32,1024x768x32,auto
    terminal_output gfxterm
    set root=(hd0,gpt1)
    multiboot2 /fbprobe3.elf
    boot
}

menuentry 'v10-3: fbprobe3 + gfxpayload=1024x768x32' {
    set gfxpayload=1024x768x32
    terminal_output gfxterm
    set root=(hd0,gpt1)
    multiboot2 /fbprobe3.elf
    boot
}

menuentry 'v10-4: Sponge OS chain (production-equivalent control)' {
    set gfxpayload=2560x1600x32,1024x768x32,auto
    terminal_output gfxterm
    set root=(hd0,gpt3)
    multiboot2 /boot/bender serial intel_hwp_performance phys_max=256M serial_fallback
    module2 /boot/sel4 sel4 disable_iommu console_port=0x3f8 debug_port=0x3f8
    module2 /boot/image.elf image.elf
    boot
}

menuentry 'v10-5: Sponge OS chain + gfxpayload=keep' {
    set gfxpayload=keep
    terminal_output gfxterm
    set root=(hd0,gpt3)
    multiboot2 /boot/bender serial intel_hwp_performance phys_max=256M serial_fallback
    module2 /boot/sel4 sel4 disable_iommu console_port=0x3f8 debug_port=0x3f8
    module2 /boot/image.elf image.elf
    boot
}

menuentry 'v10-6: videoinfo (GOP mode list)' {
    videoinfo
}
